name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: uv sync --directory backend --locked
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start Valkey
        run: bash scripts/valkey.sh start
      - name: Quality gate (full)
        run: bash team/bin/quality-gate.sh full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output
          path: |
            .team/state/*.log
            playwright-report/
            test-results/
