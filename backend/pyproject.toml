[project]
name = "autoapplier"
version = "0.1.0"
description = "AutoApplier backend: domain logic, API and worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "celery[redis]>=5.6,<6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "redis>=5.2,<6.5",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapplier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "autoapplier"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure: move IO to adapters/db and depend on a Protocol in autoapplier.ports"
type = "forbidden"
source_modules = ["autoapplier.domain"]
forbidden_modules = [
    "autoapplier.ports",
    "autoapplier.services",
    "autoapplier.db",
    "autoapplier.kv",
    "autoapplier.adapters",
    "autoapplier.security",
    "autoapplier.api",
    "autoapplier.worker",
    "autoapplier.wiring",
    "autoapplier.config",
    "celery",
    "redis",
]

[[tool.importlinter.contracts]]
name = "ports declare interfaces only: import autoapplier.domain types, nothing else internal"
type = "forbidden"
source_modules = ["autoapplier.ports"]
forbidden_modules = [
    "autoapplier.services",
    "autoapplier.db",
    "autoapplier.kv",
    "autoapplier.adapters",
    "autoapplier.api",
    "autoapplier.worker",
    "autoapplier.wiring",
    "celery",
    "redis",
]

[[tool.importlinter.contracts]]
name = "services depend on ports, not adapters: inject implementations via autoapplier.wiring"
type = "forbidden"
source_modules = ["autoapplier.services"]
forbidden_modules = [
    "autoapplier.adapters",
    "autoapplier.api",
    "autoapplier.worker",
    "autoapplier.wiring",
    "celery",
]

[[tool.importlinter.contracts]]
name = "adapters, db and kv never import services or entry points: return data, let the service decide"
type = "forbidden"
source_modules = ["autoapplier.adapters", "autoapplier.db", "autoapplier.kv"]
forbidden_modules = [
    "autoapplier.services",
    "autoapplier.api",
    "autoapplier.worker",
    "autoapplier.wiring",
]

[[tool.importlinter.contracts]]
name = "api must not import adapters: get implementations from autoapplier.wiring"
type = "forbidden"
source_modules = ["autoapplier.api"]
forbidden_modules = ["autoapplier.adapters"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api must enqueue through ports.queue.JobQueue, never import celery"
type = "forbidden"
source_modules = ["autoapplier.api"]
forbidden_modules = ["celery"]
allow_indirect_imports = true
